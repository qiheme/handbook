name: Release & Deploy

# Merge → CI → tag → (migrate) → deploy the tag. Netlify never builds this
# repo, so production deploys run from here with the Netlify CLI.
#
#   merge to main ──► CI ──► green, and still main's tip?
#                       ├─► tag:    every merge gets a tag
#                       │           version bumped → v1.5.0 + GitHub Release
#                       │           no bump        → v1.5.0+1, v1.5.0+2, ...
#                       └─► deploy: once the tag is on GitHub, check it out,
#                                   check it is the commit CI tested,
#                                   migrate (database repos) → build →
#                                   netlify deploy --prod
#
#   Actions tab → "Release & Deploy" → Run workflow (tag: v1.4.0+3)
#                  ──► deploy only, from that tag. This is the rollback path.
#                      The tag must be on main. No migrations: rolling code
#                      back never rolls the schema back.
#
# Production only ever runs a tagged commit.
#
# `+<n>` is SemVer build metadata: the same version, a later build. The
# version is still bumped by hand in a PR (`npm version <patch|minor|major>
# --no-git-tag-version`) when a change is user-facing; nothing commits back to
# main.
#
# Why one workflow and not a second one `on: push: tags`: a tag pushed with
# GITHUB_TOKEN does not start other workflows, so that would need an app token
# or PAT in every repo. It would also deploy any tag anyone pushed, tested or
# not.
#
# Gated on CI via workflow_run rather than on the push itself, so a commit that
# breaks the build is never tagged or deployed. workflow_run always runs main's
# copy of this file; the `event == 'push'` check keeps CI runs from PRs
# (including a fork branch that happens to be named "main") out.
#
# Standard: https://qiheme.github.io/handbook/#/standards/ci-cd
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)deploy to production, e.g. v1.2.0 or v1.2.0+3. Must be on main.'
        required: true

permissions:
  contents: write

# No workflow-level concurrency group on purpose: GitHub keeps only ONE pending
# run per group and cancels the rest, so a burst of merges would silently drop
# one. Every merge's run starts; a run whose commit is no longer main's tip
# stops before tagging, and the newer run tags and deploys (its tag includes
# the skipped merge's changes). Only `deploy` is serialized (job-level group).

env:
  # Pinned on purpose. Bump it deliberately, in its own PR.
  NETLIFY_CLI: netlify-cli@27.10.2
  # npm ci runs `prepare` → husky, and the tag push below would fire
  # .husky/pre-push. Every real gate already ran on the PR.
  HUSKY: '0'

jobs:
  tag:
    name: Tag the build
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      # Empty when main has moved on; the deploy job then skips.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # The commit CI tested. (On workflow_run, github.sha is main's tip when
      # CI finished, which may already be a newer merge.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      # Runs can finish out of order. Tagging only main's tip keeps tag order
      # the same as merge order. A failed lookup must stop the job, never read
      # as "main moved on" (which would silently skip the deploy).
      - name: Skip if main has moved on
        id: fresh
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ -z "$MAIN_SHA" ]; then
            echo "::error::Couldn't look up main's current commit."
            exit 1
          fi
          if [ "$MAIN_SHA" != "$HEAD_SHA" ]; then
            echo "::notice::main is now at ${MAIN_SHA::7}; not tagging ${HEAD_SHA::7} (the newer run tags and deploys)."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Idempotent: a re-run finds this commit's tag and reuses it. If another
      # run takes the same name first, the push fails and the next number is
      # tried.
      - name: Tag this commit
        id: tag
        if: steps.fresh.outputs.stale != 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          V_RE="${VERSION//./\\.}"

          TAG="$(git tag --points-at HEAD | grep -E "^v${V_RE}(\+[0-9]+)?$" | head -n 1 || true)"
          if [ -n "$TAG" ]; then
            echo "This commit is already tagged $TAG."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            for attempt in 1 2 3; do
              if [ -z "$(git tag -l "v$VERSION")" ]; then
                TAG="v$VERSION"
              else
                LAST="$(git tag -l "v$VERSION+*" | sed -n "s/^v${V_RE}+\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)"
                TAG="v$VERSION+$(( ${LAST:-0} + 1 ))"
              fi
              echo "Tagging $TAG at $(git rev-parse --short HEAD) (attempt $attempt)"
              git tag -a "$TAG" -m "Build $TAG"
              if git push origin "refs/tags/$TAG"; then
                break
              fi
              git tag -d "$TAG"
              git fetch --tags --force origin
              TAG=""
            done
            if [ -z "$TAG" ]; then
              echo "::error::Could not push a tag for $VERSION after 3 attempts."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Versions get a GitHub Release; builds (+<n>) do not. Every tagged run
      # makes sure its base version has one, so a release that failed after its
      # tag was pushed is created by the next build. Notes start at the version
      # before, so they cover every build in between.
      - name: Ensure the version's GitHub Release exists
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BASE="${TAG%%+*}"
          if [ -z "$(git tag -l "$BASE")" ]; then
            echo "No $BASE tag in this repo, so no release to create."
            exit 0
          fi
          if gh release view "$BASE" >/dev/null 2>&1; then
            echo "GitHub Release $BASE already exists."
            exit 0
          fi
          PREV="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -v b="$BASE" '$0 == b { print p; exit } { p = $0 }')"
          gh release create "$BASE" --title "$BASE" --generate-notes --verify-tag \
            ${PREV:+--notes-start-tag "$PREV"} \
            || gh release view "$BASE" >/dev/null

  deploy:
    name: Deploy to production
    needs: tag
    # After a run of `tag` that produced a tag, or on its own for a manual
    # redeploy. `tag` is also skipped when CI failed or ran for a PR, so a
    # skipped tag job only counts on a manual run.
    if: >-
      !cancelled() && (
        (needs.tag.result == 'success' && needs.tag.outputs.tag != '') ||
        (needs.tag.result == 'skipped' && github.event_name == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    # Serialize production deploys; never cancel one mid-upload.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    # Add required reviewers to this environment (Settings → Environments) to
    # put a click in front of every production deploy and its migrations.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      TAG: ${{ needs.tag.outputs.tag || inputs.tag }}
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not set. See README \"Deployment\"."
            exit 1
          fi

      # Checks out the tag from GitHub, never a SHA or a branch, so this fails
      # unless the tag is really there. `refs/tags/` stops a branch with the
      # same name being picked instead.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.tag.outputs.tag || inputs.tag }}
          persist-credentials: false

      # After a merge: the tag must point at the commit CI tested.
      # On a manual run: the tag's commit must be on main, so CI ran on it.
      # A hand-pushed tag on an unmerged branch is refused.
      - name: Check the tag is a tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            if [ "$SHA" != "$TESTED_SHA" ]; then
              echo "::error::$TAG points at ${SHA::7}, but CI tested ${TESTED_SHA::7}."
              exit 1
            fi
          else
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)"
            case "$STATUS" in
              ahead|identical) ;;
              *)
                echo "::error::$TAG (${SHA::7}) is not on main (compare status: ${STATUS:-lookup failed}). Only merged, tested commits are deployed."
                exit 1
                ;;
            esac
          fi
          echo "Deploying $TAG (${SHA::7})."

      # The tag job checked this before tagging, but a deploy can wait here for
      # a reviewer's approval while newer merges land. Don't let an older tag
      # overwrite a newer one. (Manual redeploys skip this check by design.)
      - name: Skip if main has moved on
        id: fresh
        if: github.event_name == 'workflow_run'
        # Asks the API rather than `git ls-remote`: the checkout above drops
        # its credentials, and an unauthenticated ls-remote fails on a private
        # repo. A failed lookup must stop the job, never read as "main moved
        # on" (which would silently skip the deploy).
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ -z "$MAIN_SHA" ]; then
            echo "::error::Couldn't look up main's current commit."
            exit 1
          fi
          if [ "$MAIN_SHA" != "$HEAD_SHA" ]; then
            echo "::notice::main is now at ${MAIN_SHA::7}; skipping deploy of $TAG (the newer run deploys it)."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.stale != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@q-labs'

      - name: Install dependencies
        if: steps.fresh.outputs.stale != 'true'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COBALT_PACKAGES_TOKEN }}

      # DATABASE REPOS ONLY. Delete this step if the repo has no migrations.
      #
      # Before the build, so a failed migration stops the deploy and the
      # current production keeps running. Migrations only add things, so the
      # code already live keeps working against the migrated database.
      #
      # The database secret is scoped to this step only, so npm ci (and any
      # dependency install script) and the build never see it. DIRECT_URL is
      # the Supabase session pooler string: GitHub's runners are IPv4-only and
      # can't reach the direct connection. Not run on a manual redeploy.
      - name: Migrate database
        if: steps.fresh.outputs.stale != 'true' && github.event_name == 'workflow_run'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL is not set, so migrations can't run. See README \"Deployment\"."
            exit 1
          fi
          npm run db:migrate

      # Same public build-time variables as ci.yml. Values set on the
      # `production` environment override the repository-level ones.
      - name: Build
        if: steps.fresh.outputs.stale != 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy
        id: deploy
        if: steps.fresh.outputs.stale != 'true'
        env:
          REDEPLOY: ${{ github.event_name == 'workflow_dispatch' && ' (manual redeploy)' || '' }}
        run: |
          npx --yes "$NETLIFY_CLI" deploy \
            --prod \
            --no-build \
            --dir dist \
            --message "$TAG @ $(git rev-parse --short HEAD)$REDEPLOY" \
            --json > deploy.json
          URL="$(jq -r '.url' deploy.json)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### 🚀 Deployed $TAG to production"
            echo ""
            echo "- **Site:** $URL"
            echo "- **Commit:** \`$(git rev-parse --short HEAD)\`"
            echo "- **Netlify deploy:** $(jq -r '.logs' deploy.json)"
          } >> "$GITHUB_STEP_SUMMARY"
